name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          flake8 tests --max-line-length=127

      - name: Run tests
        run: |
          pytest

      - name: Upload inference result
        uses: actions/upload-artifact@v4
        with:
          name: yolo-test-prediction
          path: artifacts/test_prediction.jpg
      - name: Build Docker image
        run: docker build -t visdrone-cicd .

      - name: Test Docker container
        run: docker run --rm visdrone-cicd
        